services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: holiday_cost
      POSTGRES_PASSWORD: holiday_cost_dev
      POSTGRES_DB: holiday_cost
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holiday_cost -d holiday_cost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
